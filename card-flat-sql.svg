  <!-- Title & Subtitle -->
  <text x="18" y="136" fill="#FFFFFF" class="sans" font-size="15" font-weight="700">⚡ flat-sql</text>
  <text x="18" y="152" fill="#888888" class="sans" font-size="9.5" font-weight="600" letter-spacing="1">PHP  •  RELATIONAL STORAGE ENGINE</text>

  <!-- Description -->
  <text x="18" y="172" fill="#cccccc" class="sans" font-size="11">Self-contained SQL query engine over flat JSON files with</text>
  <text x="18" y="188" fill="#cccccc" class="sans" font-size="11">query planner, B-tree indexes, and a web admin suite.</text>

  <!-- Tech tags -->
  <g transform="translate(18, 204)">
    <rect x="0" y="0" width="35" height="18" rx="4" fill="#171717" stroke="#333333" stroke-width="0.8" />
    <text x="17" y="13" text-anchor="middle" fill="#d4d4d4" class="mono" font-size="9">PHP</text>

    <rect x="41" y="0" width="70" height="18" rx="4" fill="#171717" stroke="#333333" stroke-width="0.8" />
    <text x="76" y="13" text-anchor="middle" fill="#d4d4d4" class="mono" font-size="9">PLANNER</text>

    <rect x="117" y="0" width="50" height="18" rx="4" fill="#171717" stroke="#333333" stroke-width="0.8" />
    <text x="142" y="13" text-anchor="middle" fill="#d4d4d4" class="mono" font-size="9">B-TREE</text>

    <rect x="173" y="0" width="60" height="18" rx="4" fill="#171717" stroke="#333333" stroke-width="0.8" />
