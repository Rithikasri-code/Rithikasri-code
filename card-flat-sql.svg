<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 280" width="410" height="280">
  <defs>
    <linearGradient id="cardBg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .mono { font-family: 'Fira Code', Consolas, monospace; }
  </style>

  <rect x="2" y="2" width="406" height="276" rx="10" fill="url(#cardBg3)" stroke="#2e2e2e" stroke-width="1.5" />

  <!-- Top Graphic Box -->
  <rect x="14" y="14" width="382" height="100" rx="6" fill="#050505" stroke="#1f1f1f" stroke-width="1" />
  
  <!-- Subtle Moon -->
  <circle cx="355" cy="40" r="14" fill="#262626" />
  <circle cx="355" cy="40" r="10" fill="#e5e5e5" />
  <circle cx="360" cy="37" r="8" fill="#050505" />

  <!-- Database Cylinders Graphic -->
  <ellipse cx="205" cy="40" rx="45" ry="12" fill="#d4d4d4" />
  <path d="M 160 40 L 160 62 A 45 12 0 0 0 250 62 L 250 40 Z" fill="#737373" />
  <ellipse cx="205" cy="62" rx="45" ry="12" fill="#a3a3a3" />
  <path d="M 160 62 L 160 84 A 45 12 0 0 0 250 84 L 250 62 Z" fill="#525252" />
  <ellipse cx="205" cy="84" rx="45" ry="12" fill="#737373" />

  <!-- Tag: PROJECT / 03 -->
  <rect x="24" y="22" width="75" height="18" rx="4" fill="#1c1c1c" stroke="#333333" stroke-width="0.8" />
