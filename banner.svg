<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 320" width="100%" height="320">
  <defs>
    <!-- Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#e8e8e8" />
      <stop offset="85%" stop-color="#b8b8b8" />
      <stop offset="100%" stop-color="#8a8a8a" />
    </linearGradient>

    <!-- River Gradient -->
    <linearGradient id="riverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#808080" />
      <stop offset="40%" stop-color="#d4d4d4" />
      <stop offset="70%" stop-color="#f5f5f5" />
      <stop offset="100%" stop-color="#e5e5e5" />
    </linearGradient>

    <!-- Dune 1 -->
    <linearGradient id="duneLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d2d2d" />
      <stop offset="60%" stop-color="#141414" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>

    <!-- Dune 2 -->
    <linearGradient id="duneRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#363636" />
      <stop offset="50%" stop-color="#181818" />
      <stop offset="100%" stop-color="#080808" />
    </linearGradient>

    <!-- Mist on horizon -->
    <linearGradient id="mist" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .typewriter {
      font-family: 'Courier New', Courier, 'Fira Code', monospace;
      font-weight: 600;
      letter-spacing: 3px;
      fill: #141414;
    }
  </style>

  <!-- Sky Canvas -->
  <rect x="0" y="0" width="950" height="320" fill="url(#skyGrad)" />

  <!-- Monospace Header Text -->
  <text x="475" y="85" text-anchor="middle" class="typewriter" font-size="28">Welcome to Rithika's Github</text>
  <text x="475" y="125" text-anchor="middle" class="typewriter" font-size="22">&lt;/&gt;</text>

  <!-- Distant mountain ridges -->
  <path d="M 0 205 Q 180 185 360 195 Q 475 190 600 195 Q 780 180 950 200 L 950 320 L 0 320 Z" fill="#222222" />
  <path d="M 0 215 Q 220 195 440 208 Q 660 198 950 215 L 950 320 L 0 320 Z" fill="#181818" />

  <!-- Winding River -->
  <path d="M 475 195 
           Q 460 215 480 235 
           Q 510 255 450 280 
           Q 390 300 480 320 
           L 550 320 
           Q 470 300 520 280 
           Q 560 255 500 235 
           Q 490 215 480 195 Z" 
        fill="url(#riverGrad)" />

  <!-- Left rolling sand dunes -->
  <path d="M 0 215 
           Q 150 205 280 240 
           Q 380 270 410 320 
           L 0 320 Z" 
        fill="url(#duneLeft)" />

  <path d="M 0 245 
           Q 120 230 220 270 
           Q 290 300 320 320 
           L 0 320 Z" 
        fill="#080808" />

  <!-- Right rolling sand dunes -->
  <path d="M 950 215 
           Q 800 205 670 240 
           Q 570 270 540 320 
           L 950 320 Z" 
        fill="url(#duneRight)" />

  <path d="M 950 245 
           Q 830 230 730 270 
           Q 660 300 630 320 
           L 950 320 Z" 
        fill="#050505" />

  <!-- Subtle Mist overlay at horizon -->
  <rect x="0" y="180" width="950" height="30" fill="url(#mist)" />
</svg>
