<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 290" width="410" height="290">
  <defs>
    <linearGradient id="cbg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1030" />
      <stop offset="100%" stop-color="#12081f" />
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .mono { font-family: 'Fira Code', Consolas, monospace; }
  </style>

  <!-- Card Border & Background -->
  <rect x="2" y="2" width="406" height="286" rx="12" fill="url(#cbg2)" stroke="#8F63AA" stroke-width="1.5" />

  <!-- Illustration Box -->
  <rect x="16" y="16" width="378" height="110" rx="8" fill="#150a24" stroke="#4a2175" stroke-width="1" />
  
  <!-- Moon / Icon -->
  <circle cx="345" cy="45" r="14" fill="#BB8BDC" opacity="0.3" />
  <circle cx="345" cy="45" r="10" fill="#E8DFF0" />
  <circle cx="350" cy="42" r="8" fill="#150a24" />

  <!-- AST Graph Nodes illustration -->
  <line x1="205" y1="40" x2="160" y2="80" stroke="#BB8BDC" stroke-width="2" />
  <line x1="205" y1="40" x2="250" y2="80" stroke="#BB8BDC" stroke-width="2" />
  <line x1="160" y1="80" x2="140" y2="108" stroke="#8F63AA" stroke-width="1.5" />
  <line x1="160" y1="80" x2="180" y2="108" stroke="#8F63AA" stroke-width="1.5" />
  <line x1="250" y1="80" x2="270" y2="108" stroke="#8F63AA" stroke-width="1.5" />
  
  <circle cx="205" cy="40" r="10" fill="#E8DFF0" stroke="#8F63AA" stroke-width="2" />
  <circle cx="160" cy="80" r="8" fill="#BB8BDC" />
  <circle cx="250" cy="80" r="8" fill="#BB8BDC" />
  <circle cx="140" cy="108" r="5" fill="#8F63AA" />
  <circle cx="180" cy="108" r="5" fill="#8F63AA" />
  <circle cx="270" cy="108" r="5" fill="#8F63AA" />

  <!-- Tag: PROJECT / 02 -->
  <rect x="26" y="24" width="75" height="18" rx="4" fill="#2d1747" stroke="#8F63AA" stroke-width="0.8" />
  <text x="63" y="37" text-anchor="middle" fill="#BB8BDC" class="mono" font-size="9" font-weight="700">PROJECT / 02</text>

  <!-- Project Title -->
  <text x="20" y="148" fill="#FFFFFF" class="sans" font-size="16" font-weight="700">Impact Engine</text>
  <text x="20" y="164" fill="#BB8BDC" class="sans" font-size="10" font-weight="600" letter-spacing="1">PYTHON / GO  •  AST COMPILER TOOLING</text>

  <!-- Description -->
  <text x="20" y="184" fill="#D1C4E9" class="sans" font-size="11.5">Semantic code search &amp; blast-radius impact analysis</text>
  <text x="20" y="200" fill="#D1C4E9" class="sans" font-size="11.5">engine using Tree-sitter AST &amp; call-graph indexing.</text>

  <!-- Tech tags -->
  <g transform="translate(20, 214)">
    <rect x="0" y="0" width="50" height="18" rx="4" fill="#2d1747" stroke="#683994" stroke-width="0.8" />
    <text x="25" y="13" text-anchor="middle" fill="#E8DFF0" class="mono" font-size="9">PYTHON</text>

    <rect x="56" y="0" width="40" height="18" rx="4" fill="#2d1747" stroke="#683994" stroke-width="0.8" />
    <text x="76" y="13" text-anchor="middle" fill="#E8DFF0" class="mono" font-size="9">GO</text>

    <rect x="102" y="0" width="65" height="18" rx="4" fill="#2d1747" stroke="#683994" stroke-width="0.8" />
    <text x="134" y="13" text-anchor="middle" fill="#E8DFF0" class="mono" font-size="9">TREE-SITTER</text>

    <rect x="173" y="0" width="55" height="18" rx="4" fill="#2d1747" stroke="#683994" stroke-width="0.8" />
    <text x="200" y="13" text-anchor="middle" fill="#E8DFF0" class="mono" font-size="9">AST GRAPH</text>
