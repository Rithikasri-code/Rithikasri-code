<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="100%" height="240">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0518" />
      <stop offset="40%" stop-color="#180b33" />
      <stop offset="80%" stop-color="#2d1254" />
      <stop offset="100%" stop-color="#120524" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Star Glow -->
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f3e8ff" stop-opacity="1" />
      <stop offset="60%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .code-font { font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace; }
    .title-font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif; font-weight: 800; letter-spacing: 2px; }
    .sub-font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif; font-weight: 600; letter-spacing: 1.5px; }
    .tag-font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 500; font-size: 11px; }
  </style>

  <!-- Background Canvas -->
  <rect x="2" y="2" width="846" height="236" rx="16" fill="url(#bgGrad)" stroke="#7c3aed" stroke-width="2" />
  <rect x="6" y="6" width="838" height="228" rx="12" fill="none" stroke="#a855f7" stroke-width="1" stroke-dasharray="8 4" stroke-opacity="0.4" />

  <!-- Stars Background -->
  <circle cx="80" cy="40" r="1.5" fill="#e9d5ff" opacity="0.6" />
  <circle cx="150" cy="70" r="1" fill="#e9d5ff" opacity="0.4" />
  <circle cx="230" cy="35" r="2" fill="#ffffff" opacity="0.8" />
  <circle cx="320" cy="80" r="1.2" fill="#c084fc" opacity="0.5" />
  <circle cx="580" cy="30" r="1" fill="#ffffff" opacity="0.5" />
  <circle cx="660" cy="75" r="2" fill="#f3e8ff" opacity="0.9" />
  <circle cx="730" cy="45" r="1.2" fill="#c084fc" opacity="0.6" />
  <circle cx="100" cy="180" r="1" fill="#ffffff" opacity="0.4" />
  <circle cx="780" cy="190" r="1.5" fill="#f3e8ff" opacity="0.5" />

  <!-- Glowing Moon at top right -->
  <circle cx="760" cy="65" r="38" fill="url(#moonGlow)" opacity="0.35" />
  <circle cx="760" cy="65" r="28" fill="#f5f3ff" opacity="0.95" />
  <!-- Crescent Shadow -->
  <circle cx="772" cy="58" r="24" fill="#180b33" />

  <!-- Skyline Silhouettes on bottom left and right -->
  <path d="M 15 236 L 15 200 L 35 200 L 35 180 L 55 180 L 55 210 L 75 210 L 75 190 L 95 190 L 95 236 Z" fill="#0d041e" opacity="0.7" />
  <path d="M 720 236 L 720 195 L 745 195 L 745 175 L 775 175 L 775 205 L 805 205 L 805 185 L 835 185 L 835 236 Z" fill="#0d041e" opacity="0.7" />

  <!-- Cyber Corner Accents -->
  <path d="M 12 28 L 12 12 L 28 12" fill="none" stroke="#c084fc" stroke-width="2.5" />
  <path d="M 838 28 L 838 12 L 822 12" fill="none" stroke="#c084fc" stroke-width="2.5" />
  <path d="M 12 212 L 12 228 L 28 228" fill="none" stroke="#c084fc" stroke-width="2.5" />
  <path d="M 838 212 L 838 228 L 822 228" fill="none" stroke="#c084fc" stroke-width="2.5" />

  <!-- Terminal Prefix -->
  <text x="425" y="44" text-anchor="middle" fill="#c084fc" class="code-font" font-size="13" letter-spacing="1">&gt; hello_world();</text>

  <!-- Main Name Header -->
  <text x="425" y="88" text-anchor="middle" fill="#ffffff" class="title-font" font-size="36" filter="url(#neonGlow)">| RITHIKA SRI |</text>

  <!-- Subtitle -->
  <text x="425" y="116" text-anchor="middle" fill="#d8b4fe" class="sub-font" font-size="13">CS UNDERGRADUATE  •  DATA PIPELINES  •  DISTRIBUTED SYSTEMS</text>

  <!-- Horizontal Divider Line -->
  <line x1="220" y1="130" x2="630" y2="130" stroke="#7c3aed" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Specialization Badges (Top Row) -->
  <g transform="translate(145, 145)">
    <!-- Badge 1: Software Dev -->
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#1e1038" stroke="#7c3aed" stroke-width="1" />
    <text x="65" y="16" text-anchor="middle" fill="#e9d5ff" class="tag-font">&lt;/&gt; Software Dev</text>

    <!-- Badge 2: Data Engineering -->
    <rect x="140" y="0" width="135" height="24" rx="12" fill="#1e1038" stroke="#7c3aed" stroke-width="1" />
    <text x="207" y="16" text-anchor="middle" fill="#e9d5ff" class="tag-font">📊 Data Engineering</text>

    <!-- Badge 3: Distributed Systems -->
    <rect x="285" y="0" width="145" height="24" rx="12" fill="#1e1038" stroke="#7c3aed" stroke-width="1" />
    <text x="357" y="16" text-anchor="middle" fill="#e9d5ff" class="tag-font">⚡ Distributed Systems</text>

    <!-- Badge 4: AST Tooling -->
    <rect x="440" y="0" width="120" height="24" rx="12" fill="#1e1038" stroke="#7c3aed" stroke-width="1" />
    <text x="500" y="16" text-anchor="middle" fill="#e9d5ff" class="tag-font">🔍 AST Tooling</text>
  </g>

  <!-- Language Pills (Bottom Row) -->
  <g transform="translate(170, 182)">
    <!-- Python -->
    <rect x="0" y="0" width="65" height="20" rx="6" fill="#130826" stroke="#a855f7" stroke-width="0.8" />
    <text x="32" y="14" text-anchor="middle" fill="#f5f3ff" class="tag-font">Python</text>

    <!-- PySpark -->
    <rect x="75" y="0" width="70" height="20" rx="6" fill="#130826" stroke="#a855f7" stroke-width="0.8" />
    <text x="110" y="14" text-anchor="middle" fill="#f5f3ff" class="tag-font">PySpark</text>

    <!-- Java -->
    <rect x="155" y="0" width="55" height="20" rx="6" fill="#130826" stroke="#a855f7" stroke-width="0.8" />
    <text x="182" y="14" text-anchor="middle" fill="#f5f3ff" class="tag-font">Java</text>

    <!-- TypeScript -->
    <rect x="220" y="0" width="85" height="20" rx="6" fill="#130826" stroke="#a855f7" stroke-width="0.8" />
    <text x="262" y="14" text-anchor="middle" fill="#f5f3ff" class="tag-font">TypeScript</text>

    <!-- SQL -->
    <rect x="315" y="0" width="55" height="20" rx="6" fill="#130826" stroke="#a855f7" stroke-width="0.8" />
    <text x="342" y="14" text-anchor="middle" fill="#f5f3ff" class="tag-font">SQL</text>

    <!-- Go -->
    <rect x="380" y="0" width="50" height="20" rx="6" fill="#130826" stroke="#a855f7" stroke-width="0.8" />
    <text x="405" y="14" text-anchor="middle" fill="#f5f3ff" class="tag-font">Go</text>

    <!-- C++ -->
    <rect x="440" y="0" width="55" height="20" rx="6" fill="#130826" stroke="#a855f7" stroke-width="0.8" />
    <text x="467" y="14" text-anchor="middle" fill="#f5f3ff" class="tag-font">C++</text>
  </g>
</svg>
